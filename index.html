<html lang="en">
<head>

<style>
:root{--bg:#f7f8fc;--surface:#fff;--surface2:#eef0f7;--text:#171923;--muted:#777d8b;--line:#e7e9f0;--blue:#1769e8;--blue2:#dce9ff;--green:#16834b;--red:#d93645;--shadow:0 12px 36px #1b294012;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "SamsungOne","Roboto",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}.app{width:min(100%,480px);min-height:100dvh;margin:auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}.status{height:30px;padding:6px 25px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:650}.status-icons{display:flex;gap:6px;align-items:center}.top{padding:22px 24px 12px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:32px;letter-spacing:-1.2px;margin:0;font-weight:750}.top-actions{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:transparent}.iconbtn:active,.action:active,.nav button:active{background:var(--surface2)}svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.search{margin:10px 20px 16px;background:var(--surface2);border-radius:16px;height:52px;display:flex;align-items:center;padding:0 16px;gap:12px}.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--text)}.search input::placeholder{color:var(--muted)}.content{padding:0 20px 100px;flex:1}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 10px}.sectionhead h2{font-size:18px;margin:0;font-weight:700}.subtle{color:var(--muted);font-size:13px}.filterrow{display:flex;gap:8px;margin:6px 0 16px}.chip{padding:8px 15px;border-radius:20px;background:var(--surface2);font-size:13px;font-weight:600}.chip.active{background:var(--blue2);color:var(--blue)}.callrow{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:76px}.avatar{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:700;color:#315d9c;background:#dce9f8}.avatar.a2{background:#f9e5db;color:#9b5434}.avatar.a3{background:#e6e0f6;color:#7054a3}.avatar.a4{background:#dcefe6;color:#36785a}.person{min-width:0;flex:1}.person strong{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.callmeta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.callmeta .out{color:var(--green)}.callmeta .miss{color:var(--red)}.callmini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:transparent}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:5px}.contactrow{display:flex;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line)}.contactrow .person small{font-size:13px}.letter{font-size:12px;font-weight:700;color:var(--muted);padding:17px 4px 3px}.star{color:#e4a31b}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:82px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:5}.nav button{border-radius:16px;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;background:transparent;color:var(--muted);font-size:11px;font-weight:600}.nav button.active{color:var(--blue)}.nav button.active .navicon{background:var(--blue2);padding:4px 20px;border-radius:20px}.navicon{height:30px;display:grid;place-items:center}.keypad{padding:6px 16px 20px}.number{height:64px;display:flex;justify-content:center;align-items:center;font-size:32px;letter-spacing:1px;font-weight:400;position:relative}.number small{position:absolute;right:10px;font-size:12px;color:var(--muted);letter-spacing:0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 14px;max-width:330px;margin:12px auto 16px}.key{height:68px;border-radius:22px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 1px 2px #10182808}.key:active{background:var(--blue2)}.key strong{font-size:27px;font-weight:450;line-height:1.1}.key small{font-size:9px;letter-spacing:1.7px;color:var(--muted);margin-top:2px}.dialactions{display:flex;align-items:center;justify-content:center;gap:28px}.callbtn{width:66px;height:66px;border-radius:50%;background:#159653;color:white;display:grid;place-items:center;box-shadow:0 5px 15px #15965335}.callbtn svg{width:28px;height:28px}.softbtn{width:48px;height:48px;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}.fab{position:fixed;bottom:100px;right:max(calc((100vw - 440px)/2),24px);width:56px;height:56px;border-radius:19px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;align-items:center;padding:calc(35px + env(safe-area-inset-top)) 28px 30px}.overlay.hidden{display:none}.calltop{color:var(--muted);font-size:13px}.callavatar{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:#dce9f8;color:#315d9c;font-size:34px;font-weight:650;margin:68px 0 18px}.callname{font-size:29px;font-weight:700;letter-spacing:-.7px}.callnumber{color:var(--muted);margin-top:5px}.callstatus{margin-top:15px;color:var(--muted);font-size:14px}.callcontrols{margin-top:auto;width:min(100%,340px);display:grid;grid-template-columns:repeat(3,1fr);gap:28px 16px;padding-bottom:36px}.callcontrol{display:flex;align-items:center;gap:9px;flex-direction:column;background:transparent;font-size:12px;color:var(--muted)}.callcontrol i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-style:normal;color:var(--text)}.callcontrol.selected i{background:var(--blue2);color:var(--blue)}.endcall{grid-column:2;width:68px;height:68px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;margin:5px auto}.modal{position:fixed;inset:0;z-index:20;background:#10152266;display:grid;place-items:end center}.modal.hidden{display:none}.sheet{width:min(100%,480px);background:var(--surface);border-radius:26px 26px 0 0;padding:24px 22px calc(26px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}.sheet h2{margin:0 0 18px;font-size:22px}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--bg);outline:0;color:var(--text)}.primary{width:100%;padding:15px;border-radius:15px;background:var(--blue);color:#fff;font-weight:650;margin-top:12px}.cancel{width:100%;padding:12px;background:transparent;color:var(--muted)}.toast{position:fixed;z-index:30;bottom:100px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#252936;color:white;padding:11px 18px;border-radius:24px;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.settingsrow{padding:17px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.toggle{width:48px;height:28px;border-radius:20px;background:#c8cbd4;padding:3px}.toggle:after{content:"";display:block;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}.toggle.on{background:var(--blue)}.toggle.on:after{transform:translateX(20px)}body.dark{--bg:#101116;--surface:#1b1d24;--surface2:#292c35;--text:#f2f3f8;--muted:#a0a4b1;--line:#30333d;--blue:#8ab4ff;--blue2:#263c5e;--green:#70d5a0;--red:#ff7b85;--shadow:0 12px 36px #0005;color-scheme:dark}.dark .avatar{filter:brightness(.85)}
@media(min-width:600px){body{padding:18px 0}.app{min-height:calc(100dvh - 36px);border-radius:28px;box-shadow:0 10px 60px #18233a12}.nav{bottom:18px;border-radius:0 0 28px 28px}.overlay{inset:18px max(calc((100vw - 480px)/2),0px);border-radius:28px}.modal{align-items:center}.sheet{border-radius:26px}}
</style></head>
<body><main class="app">
<div class="status"><span id="clock">9:41</span><span class="status-icons"><svg viewBox="0 0 24 24" style="width:15px"><path d="M3 9a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0m-9 3a4 4 0 0 1 6 0"/></svg><svg viewBox="0 0 24 24" style="width:15px"><path d="M2 8h17v11H2zM21 11v5M5 11h11v5H5z"/></svg><span>▰</span></span></div>
<header class="top"><h1 id="title">Recents</h1><div class="top-actions"><button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.9h-3l-.3-1.9a8 8 0 0 1-1.7-1l-1.7.7-1.5-2.6 1.5-1.1a7 7 0 0 1 0-2l-1.5-1.1 1.5-2.6 1.7.7a8 8 0 0 1 1.7-1L12.7 7h3l.3 1.9a8 8 0 0 1 1.7 1l1.7-.7 1.5 2.6-1.5 1.1a7 7 0 0 1 0 2Z"/></svg></button></div></header>
<div class="search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="search" placeholder="Search contacts and places" autocomplete="off"><button class="iconbtn" id="clearSearch" aria-label="Clear search" style="display:none"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<section class="content" id="content"></section>
<nav class="nav"><button data-tab="recents" class="active"><span class="navicon"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5m4-1v5l3 2"/></svg></span>Recents</button><button data-tab="contacts"><span class="navicon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6m3-12h3m-3 4h3m-3 4h3"/></svg></span>Contacts</button><button data-tab="keypad"><span class="navicon"><svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/></svg></span>Keypad</button></nav>
<button class="fab" id="addBtn" aria-label="Add contact"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</main>
<section class="overlay hidden" id="callScreen"><div class="calltop">Calling via SIM 1</div><div class="callavatar" id="callAvatar">JD</div><div class="callname" id="callName">Jordan Davis</div><div class="callnumber" id="callNumber">+1 415 555 0132</div><div class="callstatus" id="callStatus">Calling…</div><div class="callcontrols"><button class="callcontrol" data-control="mute"><i><svg viewBox="0 0 24 24"><path d="M12 2v10m-4-5v4a4 4 0 0 0 8 0V7M5 11a7 7 0 0 0 14 0m-7 7v4m-4 0h8"/></svg></i>Mute</button><button class="callcontrol" data-control="keypad"><i><svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/></svg></i>Keypad</button><button class="callcontrol" data-control="speaker"><i><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm13-1a6 6 0 0 1 0 8m2-11a10 10 0 0 1 0 14"/></svg></i>Speaker</button><button class="callcontrol" data-control="add"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>Add call</button><button class="callcontrol" data-control="video"><i><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></i>Video call</button><button class="callcontrol" data-control="bluetooth"><i><svg viewBox="0 0 24 24"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></svg></i>Bluetooth</button><button class="endcall" id="endCall" aria-label="End call"><svg viewBox="0 0 24 24" style="transform:rotate(135deg);width:30px;height:30px"><path d="M4 14c4-4 12-4 16 0l-3 4-4-2v-3H11v3l-4 2-3-4Z"/></svg></button></div></section>
<div class="modal hidden" id="contactModal"><form class="sheet" id="contactForm"><h2 id="formTitle">Create contact</h2><label class="field"><span>Name</span><input id="newName" placeholder="First and last name" required></label><label class="field"><span>Phone</span><input id="newPhone" type="tel" placeholder="Phone number" required></label><label class="field"><span>Email (optional)</span><input id="newEmail" type="email" placeholder="Email address"></label><button class="primary" type="submit">Save contact</button><button class="cancel" type="button" id="cancelModal">Cancel</button></form></div>
<div class="toast" id="toast"></div>
<script>
const seedContacts=[
{id:1,name:"Jordan Davis",phone:"+1 415 555 0132",email:"jordan.davis@example.com",favorite:true,initials:"JD",color:""},
{id:2,name:"Mom",phone:"+1 415 555 0108",favorite:true,initials:"M",color:"a2"},
{id:3,name:"Alex Morgan",phone:"+1 415 555 0194",favorite:true,initials:"AM",color:"a3"},
{id:4,name:"Taylor Kim",phone:"+1 415 555 0167",favorite:false,initials:"TK",color:"a4"},
{id:5,name:"Sam Rivera",phone:"+1 415 555 0141",favorite:false,initials:"SR",color:"a2"},
{id:6,name:"Chris Parker",phone:"+1 415 555 0175",favorite:false,initials:"CP",color:"a3"},
{id:7,name:"Jamie Lee",phone:"+1 415 555 0116",favorite:false,initials:"JL",color:"a4"}];
let contacts=[...seedContacts],tab="recents",number="",filter="All",callTimer=null,callSeconds=0,callTarget=null;
let recents=[{id:1,type:"out",when:"Today · 10:42 AM",count:1},{id:2,type:"in",when:"Today · 9:18 AM",count:1},{id:3,type:"miss",when:"Yesterday · 6:32 PM",count:2},{id:4,type:"out",when:"Yesterday · 2:15 PM",count:1},{id:5,type:"in",when:"Monday · 11:07 AM",count:1},{id:6,type:"miss",when:"Sunday · 8:51 PM",count:1}];
const $=s=>document.querySelector(s),content=$("#content"),search=$("#search");
const icon=(name)=>name==="phone"?'<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4c0 1-1 2-2 2C10 21 3 14 3 5c0-1 1-2 2-2Z"/></svg>':'';
function initials(n){return n.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()}
function person(id){return contacts.find(c=>c.id===id)}
function avatar(c){return '<div class="avatar '+(c.color||"")+'">'+(c.initials||initials(c.name))+'</div>'}
function row(c,meta,miss=false){return '<div class="callrow">'+avatar(c)+'<div class="person"><strong>'+esc(c.name)+'</strong><small>'+esc(meta)+'</small></div><div class="callmeta"><span class="'+(miss?"miss":"out")+'">'+(miss?"↙":"↗")+'</span><button class="callmini" data-call="'+c.id+'" aria-label="Call '+esc(c.name)+'">'+icon("phone")+'</button></div></div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("#title").textContent=tab==="recents"?"Recents":tab==="contacts"?"Contacts":"Keypad";$("#addBtn").style.display=tab==="keypad"?"none":"grid";search.parentElement.style.display=tab==="keypad"?"none":"flex";let q=search.value.toLowerCase().trim();if(tab==="recents"){let list=recents.filter(r=>{let c=person(r.id);return c&&(!q||c.name.toLowerCase().includes(q)||c.phone.includes(q))&&(filter==="All"||filter==="Missed"&&r.type==="miss"||filter==="Received"&&r.type==="in"||filter==="Dialed"&&r.type==="out")});content.innerHTML='<div class="filterrow">'+["All","Missed","Received","Dialed"].map(x=>'<button class="chip '+(filter===x?"active":"")+'" data-filter="'+x+'">'+x+'</button>').join("")+'</div><div class="sectionhead"><h2>Today & yesterday</h2><span class="subtle">Recent calls</span></div>'+(list.length?list.map(r=>{let c=person(r.id);return row(c,(r.type==="miss"?"Missed call":r.type==="in"?"Incoming call":"Outgoing call")+" · "+r.when,r.type==="miss")}).join(""):'<div class="empty"><b>No calls found</b>Your call history will appear here.</div>');}
if(tab==="contacts"){let list=contacts.filter(c=>!q||c.name.toLowerCase().includes(q)||c.phone.includes(q)).sort((a,b)=>a.name.localeCompare(b.name));let fav=list.filter(c=>c.favorite);content.innerHTML=(fav.length?'<div class="sectionhead"><h2>Favorites</h2><span class="subtle">Your people</span></div><div style="display:flex;gap:20px;overflow:auto;padding:8px 2px 18px">'+fav.map(c=>'<button data-person="'+c.id+'" style="background:none;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:7px">'+avatar(c)+'<span style="font-size:12px;white-space:nowrap">'+esc(c.name.split(" ")[0])+'</span></button>').join("")+'</div>':'')+'<div class="sectionhead"><h2>All contacts</h2><span class="subtle">'+list.length+' contacts</span></div>'+(list.length?list.map(c=>'<div class="contactrow">'+avatar(c)+'<div class="person" data-person="'+c.id+'"><strong>'+esc(c.name)+'</strong><small>'+esc(c.phone)+'</small></div><button class="callmini '+(c.favorite?"star":"")+'" data-star="'+c.id+'" aria-label="Favorite">'+(c.favorite?"★":"☆")+'</button><button class="callmini" data-call="'+c.id+'">'+icon("phone")+'</button></div>').join(""):'<div class="empty"><b>No contacts found</b>Try another name or number.</div>');}
if(tab==="keypad"){content.innerHTML='<div class="keypad"><div class="number"><span id="dialNumber">'+esc(number)+'</span><small id="dialName"></small></div><div class="keys">'+[["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"],["*",""],["0","+"],["#",""]].map(k=>'<button class="key" data-digit="'+k[0]+'"><strong>'+k[0]+'</strong><small>'+k[1]+'</small></button>').join("")+'</div><div class="dialactions"><button class="softbtn" id="addNumber" aria-label="Add number to contacts"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6m9-7v8m-4-4h8"/></svg></button><button class="callbtn" id="dialCall" aria-label="Call">'+icon("phone")+'</button><button class="softbtn" id="backspace" aria-label="Delete digit"><svg viewBox="0 0 24 24"><path d="M9 5H21V19H9L3 12 9 5Z"/><path d="m13 9 5 6m0-6-5 6"/></svg></button></div></div>';updateDial();}}
function updateDial(){let el=$("#dialNumber");if(el)el.textContent=number;let match=contacts.find(c=>c.phone.replace(/\D/g,"").endsWith(number.replace(/\D/g,""))&&number.length>4);let m=$("#dialName");if(m)m.textContent=match?match.name:""}
document.addEventListener("click",e=>{let t=e.target.closest("button,[data-person]");if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render()}if(t.dataset.filter){filter=t.dataset.filter;render()}if(t.dataset.digit){number+=t.dataset.digit;updateDial()}if(t.id==="backspace"){number=number.slice(0,-1);updateDial()}if(t.id==="dialCall"){if(number)startCall({name:number,phone:number,initials:"",color:""})}if(t.id==="addNumber"){openModal(null,number)}if(t.dataset.call){let c=person(+t.dataset.call);if(c)startCall(c)}if(t.dataset.person){let c=person(+t.dataset.person);if(c)showContact(c)}if(t.dataset.star){let c=person(+t.dataset.star);c.favorite=!c.favorite;render()}if(t.id==="settingsBtn")showSettings();if(t.id==="addBtn")openModal();if(t.id==="cancelModal")closeModal();if(t.id==="endCall")endCall();if(t.dataset.control){t.classList.toggle("selected");toast(t.dataset.control.charAt(0).toUpperCase()+t.dataset.control.slice(1)+" toggled")}});
search.addEventListener("input",()=>{$("#clearSearch").style.display=search.value?"grid":"none";render()});$("#clearSearch").onclick=()=>{search.value="";$("#clearSearch").style.display="none";render()};
function startCall(c){callTarget=c;$("#callAvatar").textContent=c.initials||initials(c.name);$("#callName").textContent=c.name;$("#callNumber").textContent=c.phone;$("#callStatus").textContent="Calling…";$("#callScreen").classList.remove("hidden");callSeconds=0;clearInterval(callTimer);callTimer=setInterval(()=>{callSeconds++;if(callSeconds>2)$("#callStatus").textContent="00:"+String(callSeconds-2).padStart(2,"0")},1000)}
function endCall(){clearInterval(callTimer);$("#callScreen").classList.add("hidden");if(callTarget&&contacts.some(c=>c.phone===callTarget.phone)){let c=contacts.find(c=>c.phone===callTarget.phone);recents.unshift({id:c.id,type:"out",when:"Just now",count:1})}toast("Call ended");if(tab==="recents")render()}
function toast(s){let t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function showContact(c){let ok=confirm(c.name+"\n"+c.phone+"\n\nCall this contact?\nChoose Cancel to close.");if(ok)startCall(c)}
function openModal(name=null,phone=""){ $("#contactModal").classList.remove("hidden");$("#newName").value=name||"";$("#newPhone").value=phone;$("#newEmail").value="";$("#newName").focus()}
function closeModal(){$("#contactModal").classList.add("hidden")}
$("#contactForm").addEventListener("submit",e=>{e.preventDefault();let c={id:Math.max(0,...contacts.map(x=>x.id))+1,name:$("#newName").value.trim(),phone:$("#newPhone").value.trim(),email:$("#newEmail").value.trim(),favorite:false};c.initials=initials(c.name);contacts.push(c);closeModal();tab="contacts";search.value="";render();toast("Contact saved")});
function showSettings(){let dark=document.body.classList.contains("dark");let choice=confirm("Phone settings\n\n"+(dark?"Switch to light appearance?":"Switch to dark appearance?")+"\n\nOK to toggle appearance.");if(choice){document.body.classList.toggle("dark");localStorage.setItem("duckdialer-dark",document.body.classList.contains("dark"))}}
if(localStorage.getItem("duckdialer-dark")==="true")document.body.classList.add("dark");
function tick(){let d=new Date();$("#clock").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}tick();setInterval(tick,30000);render();
</script></body></html>
